runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: DEPLOYMENT_MODE
    value: single_clinic
    availability:
      - BUILD
      - RUNTIME

  - variable: ENABLED_FEATURES
    value: paystack,mnotify
    availability:
      - BUILD
      - RUNTIME

  - variable: SMS_PROVIDER
    value: mnotify
    availability:
      - BUILD
      - RUNTIME

  - variable: DEMO_MODE
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_API_URL
    value: https://nexusdental--nexusdentalsystem.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: https://nexusdental--nexusdentalsystem.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    value: 871183265953-i9ctm5b8jck6er4ah22c9cs24g55i4fq.apps.googleusercontent.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCpFe20EmaY_2xQNoX7V97PCyzBoXtZfK4
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: nexusdentalsystem.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: nexusdentalsystem
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:871183265953:web:fb0e52c47d8d599e9600e0"
    availability:
      - BUILD
      - RUNTIME

  # ─── Secrets (stored in Google Cloud Secret Manager) ───────────
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: JWT_SECRET
    secret: JWT_SECRET

  - variable: CLINIC_ID
    secret: CLINIC_ID

  - variable: REDIS_URL
    secret: REDIS_URL

  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  - variable: EMAIL_FROM
    secret: EMAIL_FROM

  - variable: PAYSTACK_SECRET_KEY
    secret: PAYSTACK_SECRET_KEY

  - variable: MNOTIFY_API_KEY
    secret: MNOTIFY_API_KEY

  - variable: MNOTIFY_SENDER_ID
    secret: MNOTIFY_SENDER_ID

  - variable: DEMO_SMS_ALLOWLIST
    secret: DEMO_SMS_ALLOWLIST

  - variable: HUBTEL_CLIENT_ID
    secret: HUBTEL_CLIENT_ID

  - variable: HUBTEL_CLIENT_SECRET
    secret: HUBTEL_CLIENT_SECRET

  - variable: HUBTEL_SENDER_ID
    secret: HUBTEL_SENDER_ID

  - variable: HUBTEL_WHATSAPP_NUMBER
    secret: HUBTEL_WHATSAPP_NUMBER

  - variable: BACKUP_WEBHOOK_SECRET
    secret: BACKUP_WEBHOOK_SECRET

  # GITHUB_ACTIONS_TOKEN intentionally omitted — only needed for the optional
  # manual "run backup now" dispatch button (src/lib/system/backups.ts,
  # triggerManualBackup). Add it back here once that secret actually exists:
  #   firebase apphosting:secrets:set GITHUB_ACTIONS_TOKEN --project nexusdentalsystem
  #   firebase apphosting:secrets:grantaccess GITHUB_ACTIONS_TOKEN --backend nexusdental --project nexusdentalsystem
  # then re-add:
  #   - variable: GITHUB_ACTIONS_TOKEN
  #     secret: GITHUB_ACTIONS_TOKEN

  - variable: GITHUB_REPO
    value: johnsedofiadakey-hue/Nexus-Dental
    availability:
      - BUILD
      - RUNTIME
